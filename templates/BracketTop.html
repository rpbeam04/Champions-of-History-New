<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>History Madness</title>
  <style>
    /* Layout */
    @page {
      size: 2500px 900px;
      margin: 0px;
    }

    body {
      font-family: sans-serif;
      /* Base font size for the document */
      font-size: 14px;
      padding: 15px;
      background-color: #f4f4f4;
      break-after: avoid;
    break-before: avoid;
    break-inside: avoid;
    page-break-inside: avoid;
    page-break-before: avoid;
    page-break-after: avoid;
    }

    h1, h2 {
      text-align: center;
    }

    /* Heading sizes */
    h1 { font-size: 32px; }
    h2 { font-size: 20px; }

    main {
      display: flex;
      justify-content: space-between;
      overflow: auto;
      align-items: center; /* vertically center children based on content height */
    } 

    .bracket-left,
    .bracket-right {
      display: flex;
      flex-direction: row;
      overflow: visible;
      z-index: 0;
      flex: 1; /* allow left and right columns to take equal available space so center sits in the middle */
    }

    .round {
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 200px;
      list-style: none;
      padding: 0;
    }

    .round .spacer {
      flex-grow: 2;
      min-height: 4px;
    }

    .round .spacer:first-child,
    .round .spacer:last-child {
      flex-grow: 1;
    }

    .round .game-spacer {
      flex-grow: 2;
    }

    .bracket-left li.game {
    display: flex;
    align-items: baseline;   /* Align text properly */
    /* Use relative sizes based on the document base */
    font-size: 0.9rem;
    white-space: nowrap;
    padding-left: 5px;
    }

    .bracket-left li.game .seed {
    font-size: 0.65rem;           /* Smaller seed */
    margin-right: 4px;
    color: #666;              /* Optional: lighter color */
    flex-shrink: 0;           /* Prevent it from stretching or shrinking */
    }

    .bracket-left li.game.winner {
      font-weight: bold;
    }

    .bracket-left li.game span {
      float: left;
      font-size: 0.65rem;
      margin-right: 3px;
    }

    .bracket-left li.game-top {
      border-bottom: 1px solid #aaa;
    }

    .bracket-left li.game-spacer {
      display: flex;
      border-right: 1px solid #aaa;
      min-height: 4px;
      align-items: center;
      justify-content: right;
      padding-right: 10px;
      font-size: 0.8rem;
      font-variant-caps: all-small-caps;
      color: #666;
    }

    .bracket-left li.game-bottom {
      border-right: 1px solid #aaa;
      border-bottom: 1px solid #aaa;
    }

    /* Right bracket (mirrored) */
    .bracket-right {
      direction: rtl;
    }

    .bracket-right .round {
      direction: ltr;
    }

    .bracket-right li.game {
    display: flex;
    flex-direction: row; /* Show seed first, then name */
    justify-content: flex-end;   /* Align everything to the right */
    align-items: baseline;
    white-space: nowrap;
    font-size: 0.9rem;
    padding-right: 5px;
    text-align: right;
    direction: ltr; /* Prevent text and numbers from flipping */
    }

    .bracket-right li.game .seed {
    font-size: 0.65rem;
    margin-left: 4px;  /* space between seed and team name */
    color: #666;
    flex-shrink: 0;
    }


    .bracket-right li.game span {
      float: right;
      font-size: 0.65rem;
      margin-left: 3px;
    }

    .bracket-right li.game-top {
      border-bottom: 1px solid #aaa;
    }

    .bracket-right li.game-bottom {
      border-left: 1px solid #aaa;
      border-bottom: 1px solid #aaa;
    }

    .bracket-right li.game-spacer {
      border-left: 1px solid #aaa;
      min-height: 4px;
      text-align: left;        /* Force LTR text layout */
      direction: ltr; 
      display: flex;
      align-items: center;
      justify-content: left;
      padding-left: 10px;
      font-size: 0.8rem;
      font-variant-caps: all-small-caps;
      color: #666;
    }

    .bracket-center {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      min-width: 150px;
      position: relative; /* keep in normal flow so vertical centering uses content height */
      margin: 0 auto;     /* center horizontally within remaining space */
      overflow: visible;
      z-index: 10;           /* Ensure it’s above overlapping siblings if needed */
    }
    .round.round-7 {
        list-style: none;
        padding: 0;
        margin: 0;
        text-align: center;
    }

    .round.round-7 li.game {
      display: flex;
      justify-content: center;
      border-bottom: 1px solid #aaa;
      font-weight: bold;
      overflow: visible;
      font-size: 1rem;
    }


  </style>
</head>
  <body>
    <div class="bracket-container">
    <!-- Wrapper scales the entire bracket content; adjust --scale-- to change zoom -->
    <style>
      :root{--bracket-scale:0.90}
      .bracket-container{transform:scale(var(--bracket-scale));transform-origin:top center;width:calc(100% / var(--bracket-scale));}
    </style>
